# llmdup local profile: shrink the router so it fits a laptop kind cluster.
# Layered after the guide's own values with `helm upgrade --reuse-values`.
router:
  epp:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  proxy:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}

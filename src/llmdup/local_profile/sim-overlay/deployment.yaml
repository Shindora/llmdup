# Flags from the llm-d-inference-sim v1.2.0 README and docs/configuration.md. Without --render-url the
# simulator uses its built-in tokenizer, so no render sidecar and no model download are needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmdup-sim
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: modelserver
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.2.0
          imagePullPolicy: IfNotPresent
          args: ["--model", "llmdup-sim", "--port", "8000", "--mode", "random", "--max-model-len", "32768", "--max-num-seqs", "64"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - name: modelserver
              containerPort: 8000
          readinessProbe:
            tcpSocket: {port: modelserver}
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
